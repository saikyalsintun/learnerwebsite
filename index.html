<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

```
<title>Learning Center</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #1b1b2f, #162447, #1f4068);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    .container {
        width: 90%;
        max-width: 900px;
        text-align: center;
    }

    .logo {
        width: 80px;
        height: 80px;
        margin: 0 auto 25px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        backdrop-filter: blur(10px);
    }

    h1 {
        font-size: 42px;
        margin-bottom: 12px;
    }

    .subtitle {
        color: #cfd8e3;
        font-size: 17px;
        margin-bottom: 45px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
    }

    .card {
        text-decoration: none;
        color: white;
        padding: 40px 25px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.10);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        transition: all 0.3s ease;
    }

    .card:hover {
        transform: translateY(-8px);
        background: rgba(255, 255, 255, 0.17);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .icon {
        font-size: 55px;
        margin-bottom: 20px;
    }

    .card h2 {
        font-size: 25px;
        margin-bottom: 10px;
    }

    .card p {
        color: #cfd8e3;
        font-size: 14px;
        line-height: 1.6;
    }

    .arrow {
        display: inline-block;
        margin-top: 20px;
        font-size: 14px;
        font-weight: bold;
    }

    footer {
        margin-top: 45px;
        color: #9da9b8;
        font-size: 13px;
    }

    @media (max-width: 650px) {
        h1 {
            font-size: 32px;
        }

        .cards {
            grid-template-columns: 1fr;
        }

        .card {
            padding: 30px 20px;
        }
    }
</style>
```

</head>

<body>

```
<div class="container">

    <div class="logo">
        📚
    </div>

    <h1>Learning Center</h1>

    <p class="subtitle">
        Choose a learning platform to continue
    </p>

    <div class="cards">

        <!-- Chinese -->
        <a href="./Chinese/index.html" class="card">
            <div class="icon">🇨🇳</div>

            <h2>Chinese</h2>

            <p>
                Chinese language lessons, vocabulary,
                exercises and chapter tests.
            </p>

            <span class="arrow">
                Enter Chinese →
            </span>
        </a>

        <!-- IELTS -->
        <a href="./IELTS/index.html" class="card">
            <div class="icon">📖</div>

            <h2>IELTS</h2>

            <p>
                IELTS Reading practice tests,
                passages and exam exercises.
            </p>

            <span class="arrow">
                Enter IELTS →
            </span>
        </a>

    </div>

    <footer>
        © 2026 Learning Center
    </footer>

</div>
```
